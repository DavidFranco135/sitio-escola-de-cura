<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sítio Escola de Cura - Hospedagens</title>

<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto;background:linear-gradient(to bottom right,#1a1a1a,#0d0d0d);min-height:100vh;padding:24px;color:#e5e7eb}
.container{max-width:1280px;margin:0 auto}
.card{background:#1f2937;border-radius:12px;padding:24px}
.title{font-size:30px;font-weight:bold;color:#34d399;text-align:center;margin-bottom:24px}
.tabs{display:flex;gap:8px;border-bottom:1px solid #374151;margin-bottom:24px}
.tab{background:none;border:none;color:#9ca3af;padding:8px 16px;cursor:pointer}
.tab.active{color:#34d399;border-bottom:2px solid #34d399}
.hidden{display:none}
</style>
</head>

<body>

<div id="root"></div>

<script>
/* ===== ESTADO DA APLICAÇÃO ===== */
let state = {
  activeTab: 'bookings'
};

/* ===== RENDER ===== */
function render() {
  document.getElementById('root').innerHTML = `
    <div class="container">
      <div class="card">
        <h1 class="title">Sítio Escola de Cura</h1>

        <div class="tabs">
          <button class="tab ${state.activeTab === 'bookings' ? 'active' : ''}"
            onclick="state.activeTab='bookings';render()">Hospedagens</button>

          <button class="tab ${state.activeTab === 'schedule' ? 'active' : ''}"
            onclick="state.activeTab='schedule';render()">Agendamentos</button>
        </div>

        ${
          state.activeTab === 'bookings'
            ? '<p>Área de Hospedagens</p>'
            : '<p>Área de Agendamentos</p>'
        }
      </div>
    </div>
  `;
}

/* ===== START ===== */
document.addEventListener('DOMContentLoaded', render);
</script>

</body>
</html>
