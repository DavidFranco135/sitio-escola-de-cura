    <!-- ======= SEU SCRIPT ORIGINAL (NÃO ALTERADO) ======= -->
    <script>
        let state = {
            activeTab: 'bookings',
            bookings: [],
            editingId: null,
            newBooking: {
                name: '',
                checkIn: '',
                checkOut: '',
                total: '',
                paid: '',
                note: ''
            }
        };

        async function loadBookings() {
            try {
                const keys = Object.keys(localStorage).filter(key => key.startsWith('booking:'));
                const loaded = keys.map(key => {
                    const data = localStorage.getItem(key);
                    return data ? JSON.parse(data) : null;
                }).filter(Boolean);

                state.bookings = loaded.sort((a, b) =>
                    new Date(a.checkIn) - new Date(b.checkIn)
                );
            } catch (error) {
                console.log('Nenhuma reserva encontrada');
            }
            render();
        }

        /* TODO O RESTANTE DO SEU JS CONTINUA IGUAL */
        document.addEventListener('DOMContentLoaded', () => {
            loadBookings();
        });
    </script>
