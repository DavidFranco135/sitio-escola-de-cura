<html lang="pt-BR">
<head>

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox" class="container">
  <div class="card">
    <h1 class="title">Login</h1>
    <input id="email" class="input" placeholder="E-mail">
    <input id="password" class="input" type="password" placeholder="Senha" style="margin-top:10px">
    <button class="btn" style="margin-top:16px" onclick="login()">Entrar</button>
    <p id="loginError" style="color:#f87171;margin-top:10px"></p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div id="root"></div>
</div>

<script>
/* 🔥 FIREBASE CONFIG */
firebase.initializeApp({
  apiKey: "AIzaSyDIQw3v9C7FnRNf8_uwiqbx2NLvVEIrNke0",
  authDomain: "sitio-escola-de-cura.firebaseapp.com",
  projectId: "sitio-escola-de-cura",
});

const auth = firebase.auth();
const db = firebase.firestore();

/* 🔐 LOGIN */
function login() {
  auth.signInWithEmailAndPassword(
    email.value,
    password.value
  ).catch(e => loginError.innerText = e.message);
}

/* 🔒 CONTROLE DE SESSÃO */
auth.onAuthStateChanged(user => {
  if (user) {
    loginBox.classList.add('hidden');
    app.classList.remove('hidden');
    loadBookings();
  } else {
    loginBox.classList.remove('hidden');
    app.classList.add('hidden');
  }
});

/* 🔁 ESTADO ORIGINAL */
let state = {
  activeTab: 'bookings',
  bookings: [],
  editingId: null,
  newBooking: {
    name:'',checkIn:'',checkOut:'',total:'',paid:'',note:''
  }
};

/* 🔥 FIRESTORE */
async function loadBookings() {
  const snap = await db.collection('reservas').orderBy('checkIn').get();
  state.bookings = snap.docs.map(d => ({ id:d.id, ...d.data() }));
  render();
}

async function handleAdd() {
  const b = state.newBooking;
  if (!b.name || !b.checkIn || !b.checkOut) return alert('Preencha nome e datas');

  b.total = +b.total || 0;
  b.paid = +b.paid || 0;
  b.pending = b.total - b.paid;

  await db.collection('reservas').add(b);
  state.newBooking = { name:'',checkIn:'',checkOut:'',total:'',paid:'',note:'' };
  loadBookings();
}

async function handleSaveEdit(id) {
  const b = state.bookings.find(x => x.id === id);
  b.pending = b.total - b.paid;
  await db.collection('reservas').doc(id).update(b);
  state.editingId = null;
  loadBookings();
}

async function handleDelete(id) {
  if (confirm('Excluir reserva?')) {
    await db.collection('reservas').doc(id).delete();
    loadBookings();
  }
}

/* 🔁 FUNÇÕES ORIGINAIS */
function changeTab(t){state.activeTab=t;render()}
function updateNewBooking(f,v){state.newBooking[f]=v}
function updateBooking(id,f,v){
  const b=state.bookings.find(x=>x.id===id);
  b[f]=['name','note','checkIn','checkOut'].includes(f)?v:+v||0;
}
function handleEdit(id){state.editingId=id;render()}
function handleCancelEdit(){state.editingId=null;render()}
function fmt(v){return`R$ ${v.toFixed(2)}`}
function fmtDate(d){return new Date(d+'T00:00').toLocaleDateString('pt-BR')}

/* 🔁 RENDER ORIGINAL (INALTERADO) */

</script>
</body>
</html>
