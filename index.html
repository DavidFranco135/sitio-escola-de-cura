<html lang="pt-BR">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 12px;
    color: #1f2937;
}

@media (min-width: 768px) {
    body {
        padding: 24px;
    }
}

.container {
    max-width: 1400px;
    margin: 0 auto;
}

.card {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    padding: 16px;
    margin-bottom: 24px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.card:hover {
    transform: translateY(-2px);
    box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
}

@media (min-width: 768px) {
    .card {
        padding: 32px;
    }
}

.title {
    font-size: 28px;
    font-weight: 800;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 24px;
    text-align: center;
}

@media (min-width: 768px) {
    .title {
        font-size: 36px;
    }
}

.tabs {
    display: flex;
    gap: 8px;
    border-bottom: 2px solid #e5e7eb;
    margin-bottom: 24px;
    overflow-x: auto;
}

.tab {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 20px;
    font-weight: 600;
    background: none;
    border: none;
    cursor: pointer;
    color: #6b7280;
    transition: all 0.3s ease;
    border-bottom: 3px solid transparent;
    white-space: nowrap;
}

.tab:hover {
    color: #667eea;
    background: rgba(102, 126, 234, 0.1);
    border-radius: 8px 8px 0 0;
}

.tab.active {
    color: #667eea;
    border-bottom-color: #667eea;
}

.form-container {
    background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 24px;
    border: 2px solid rgba(102, 126, 234, 0.2);
}

.form-title {
    font-weight: 700;
    color: #667eea;
    margin-bottom: 16px;
    font-size: 18px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;

}

@media (min-width: 768px) {
    .form-grid {
        grid-template-columns: repeat(5, 1fr);
    }
}

.input-wrapper {
    position: relative;
}

.input {
    padding: 12px 16px;
    background: white;
    color: #1f2937;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    font-size: 15px;
    width: 100%;
    transition: all 0.3s ease;
    font-weight: 500;
}

.input:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

.input::placeholder {
    color: #9ca3af;
}

.input.error {
    border-color: #ef4444;
    animation: shake 0.3s;
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
}

.date-wrapper {
    position: relative;
    width: 100%;
}

.date-label {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: #9ca3af;
    pointer-events: none;
    font-size: 15px;
    transition: all 0.2s;
    z-index: 1;
    font-weight: 500;
}

.input[type="date"]:focus + .date-label,
.input[type="date"]:valid + .date-label {
    opacity: 0;
}

.input[type="date"]::-webkit-datetime-edit {
    color: transparent;
}

.input[type="date"]:focus::-webkit-datetime-edit,
.input[type="date"]:valid::-webkit-datetime-edit {
    color: #1f2937;
}

.btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 28px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
}

.btn:active {
    transform: translateY(0);
}

.table-wrapper {
    background: white;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
}

.table-container {
    overflow-x: auto;
    max-height: 600px;
    overflow-y: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

thead {
    position: sticky;
    top: 0;
    z-index: 10;
}

thead tr {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
}

th {
    text-align: left;
    padding: 16px 12px;
    font-weight: 700;
    color: white;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

tbody tr {
    border-bottom: 1px solid #f3f4f6;
    transition: all 0.2s ease;
}

tbody tr:nth-child(even) {
    background-color: #f9fafb;
}

tbody tr:hover {
    background-color: rgba(102, 126, 234, 0.05);
    transform: scale(1.01);
}

td {
    padding: 16px 12px;
    font-size: 14px;
    font-weight: 500;
}

.text-gray-100 {
    color: #1f2937;
}

.text-gray-300 {
    color: #4b5563;
}

.text-gray-400 {
    color: #6b7280;
}

.text-green {
    color: #10b981;
    font-weight: 600;
}

.text-orange {
    color: #f59e0b;
    font-weight: 600;
}

.actions {
    display: flex;
    gap: 8px;
    justify-content: center;
}

.icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px;
    border-radius: 8px;
    transition: all 0.2s ease;
}

.icon-btn:hover {
    transform: scale(1.1);
}

.icon-btn.blue {
    color: #3b82f6;
}

.icon-btn.blue:hover {
    background: rgba(59, 130, 246, 0.1);
}

.icon-btn.red {
    color: #ef4444;
}

.icon-btn.red:hover {
    background: rgba(239, 68, 68, 0.1);
}

.icon-btn.green {
    color: #10b981;
}

.icon-btn.green:hover {
    background: rgba(16, 185, 129, 0.1);
}

.icon-btn.gray {
    color: #6b7280;
}

.icon-btn.gray:hover {
    background: rgba(107, 114, 128, 0.1);
}

.empty-state {
    text-align: center;
    padding: 48px;
    color: #9ca3af;
    font-size: 16px;
}

.schedule-container {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
}

@media (min-width: 768px) {
    .schedule-container {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (min-width: 1024px) {
    .schedule-container {
        grid-template-columns: repeat(3, 1fr);
    }
}

.schedule-title {
    font-size: 24px;
    font-weight: 700;
    color: #667eea;
    margin-bottom: 20px;
}

.schedule-card {
    background: white;
    border-radius: 16px;
    padding: 20px;
    border-left: 5px solid #667eea;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    transition: all 0.3s ease;
}

.schedule-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
}

.schedule-name {
    font-size: 18px;
    font-weight: 700;
    color: #1f2937;
    margin-bottom: 12px;
}

.schedule-grid {
    display: grid;
    gap: 8px;
    font-size: 14px;
    margin-bottom: 12px;
}

.schedule-info {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #6b7280;
}

.schedule-info strong {
    color: #1f2937;
    font-weight: 600;
}

.schedule-note {
    margin-top: 12px;
    padding: 12px;
    background: rgba(102, 126, 234, 0.05);
    border-radius: 8px;
    font-size: 13px;
    color: #4b5563;
    font-style: italic;
}

.schedule-price {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 2px solid #f3f4f6;
    text-align: right;
}

.schedule-price-label {
    font-size: 12px;
    color: #6b7280;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.schedule-price-value {
    font-size: 24px;
    font-weight: 800;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.schedule-pending {
    font-size: 13px;
    color: #f59e0b;
    margin-top: 4px;
    font-weight: 600;
}

.schedule-paid {
    font-size: 13px;
    color: #10b981;
    margin-top: 4px;
    font-weight: 600;
}

.empty-schedule {
    text-align: center;
    padding: 64px 24px;
    grid-column: 1 / -1;
}

.empty-schedule-icon {
    width: 80px;
    height: 80px;
    margin: 0 auto 16px;
    opacity: 0.3;
    color: #9ca3af;
}

/* Toast notifications */
.toast-container {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.toast {
    background: white;
    padding: 16px 20px;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 300px;
    animation: slideIn 0.3s ease;
    border-left: 4px solid;
}

.toast.success {
    border-left-color: #10b981;
}

.toast.error {
    border-left-color: #ef4444;
}

.toast.warning {
    border-left-color: #f59e0b;
}

.toast-icon {
    flex-shrink: 0;
}

.toast-message {
    flex: 1;
    font-size: 14px;
    font-weight: 500;
    color: #1f2937;
}

@keyframes slideIn {
    from {
        transform: translateX(400px);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}

@keyframes slideOut {
    from {
        transform: translateX(0);
        opacity: 1;
    }
    to {
        transform: translateX(400px);
        opacity: 0;
    }
}

.toast.removing {
    animation: slideOut 0.3s ease forwards;
}

.badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.badge.success {
    background: #d1fae5;
    color: #065f46;
}

.badge.warning {
    background: #fef3c7;
    color: #92400e;
}
</style>
</head>

<body>
<div id="toast-container" class="toast-container"></div>
<div id="root"></div>

<script>
// Firebase
firebase.initializeApp({
  apiKey: "AIzaSyDIQw3v9C7FnRNf8_uuiqbx2NLvVErNke0",
  authDomain: "sitio-escola-de-cura.firebaseapp.com",
  projectId: "sitio-escola-de-cura"
});
const db = firebase.firestore();

// Estado
let state = {
  activeTab: 'bookings',
  bookings: [],
  editingId: null,
  newBooking: {name: '', checkIn: '', checkOut: '', total: '', paid: '', note: '', seller: '', guests: ''}
};

// Toast notifications
function showToast(message, type = 'success') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  
  const icon = type === 'success' ? '✓' : type === 'error' ? '✕' : '⚠';
  const iconColor = type === 'success' ? '#10b981' : type === 'error' ? '#ef4444' : '#f59e0b';
  
  toast.innerHTML = `
    <div class="toast-icon" style="color: ${iconColor}; font-size: 20px; font-weight: bold;">${icon}</div>
    <div class="toast-message">${message}</div>
  `;
  
  container.appendChild(toast);
  
  setTimeout(() => {
    toast.classList.add('removing');
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

// Firestore
async function loadBookings() {
  const snap = await db.collection("bookings").orderBy("checkIn").get();
  state.bookings = snap.docs.map(d => d.data());
  render();
}

async function handleAdd() {
  const b = state.newBooking;
  if (!b.name || !b.checkIn || !b.checkOut) {
    showToast('Preencha nome e datas', 'error');
    return;
  }

  // Verificar se as datas estão disponíveis
  const newCheckIn = new Date(b.checkIn + 'T00:00:00');
  const newCheckOut = new Date(b.checkOut + 'T00:00:00');

  const conflict = state.bookings.find(booking => {
    const existingCheckIn = new Date(booking.checkIn + 'T00:00:00');
    const existingCheckOut = new Date(booking.checkOut + 'T00:00:00');
    return !(newCheckOut <= existingCheckIn || newCheckIn >= existingCheckOut);
  });

  if (conflict) {
    showToast(`Data indisponível! Já existe uma reserva de ${conflict.name} entre ${fmtDate(conflict.checkIn)} e ${fmtDate(conflict.checkOut)}`, 'error');
    return;
  }

  const booking = {
    id: 'booking_' + Date.now(),
    name: b.name,
    checkIn: b.checkIn,
    checkOut: b.checkOut,
    total: +b.total || 0,
    paid: +b.paid || 0,
    pending: (+b.total || 0) - (+b.paid || 0),
    note: b.note || '',
    seller: b.seller || '',
    guests: +b.guests || 0
  };

  await db.collection("bookings").doc(booking.id).set(booking);
  state.newBooking = {name: '', checkIn: '', checkOut: '', total: '', paid: '', note: '', seller: '', guests: ''};
  showToast('Reserva cadastrada com sucesso!', 'success');
  loadBookings();
}

async function handleDelete(id) {
  if (confirm('Deseja realmente excluir esta reserva?')) {
    await db.collection("bookings").doc(id).delete();
    showToast('Reserva excluída com sucesso!', 'success');
    loadBookings();
  }
}

function handleEdit(id) {
  state.editingId = id;
  render();
}

function handleCancelEdit() {
  state.editingId = null;
  loadBookings();
}

async function handleSaveEdit(id) {
  const b = state.bookings.find(x => x.id === id);
  
  const newCheckIn = new Date(b.checkIn + 'T00:00:00');
  const newCheckOut = new Date(b.checkOut + 'T00:00:00');

  const conflict = state.bookings.find(booking => {
    if (booking.id === id) return false;
    const existingCheckIn = new Date(booking.checkIn + 'T00:00:00');
    const existingCheckOut = new Date(booking.checkOut + 'T00:00:00');
    return !(newCheckOut <= existingCheckIn || newCheckIn >= existingCheckOut);
  });

  if (conflict) {
    showToast(`Data indisponível! Já existe uma reserva de ${conflict.name} entre ${fmtDate(conflict.checkIn)} e ${fmtDate(conflict.checkOut)}`, 'error');
    return;
  }

  b.pending = b.total - b.paid;
  await db.collection("bookings").doc(id).set(b);
  state.editingId = null;
  showToast('Reserva atualizada com sucesso!', 'success');
  loadBookings();
}

function changeTab(t) {
  state.activeTab = t;
  render();
}

function updateNewBooking(f, v) {
  state.newBooking[f] = v;
}

function updateBooking(id, f, v) {
  const b = state.bookings.find(x => x.id === id);
  if (f === 'name' || f === 'note' || f === 'checkIn' || f === 'checkOut' || f === 'seller') {
    b[f] = v;
  } else {
    b[f] = +v || 0;
  }
}

function fmt(v) {
  return `R$ ${Math.round(v).toLocaleString('pt-BR')}`;
}

function fmtDate(d) {
  return new Date(d + 'T00:00:00').toLocaleDateString('pt-BR');
}

function renderBookingsTab() {
  return `
    <div class="form-container">
      <h2 class="form-title">Nova Reserva</h2>
      <div class="form-grid">
        <div class="input-wrapper">
          <input type="text" class="input" placeholder="Nome completo" value="${state.newBooking.name}" onchange="updateNewBooking('name', this.value)" />
        </div>
        <div class="date-wrapper">
          <input type="date" class="input" value="${state.newBooking.checkIn}" onchange="updateNewBooking('checkIn', this.value)" onfocus="this.showPicker()" />
          <label class="date-label">Entrada</label>
        </div>
        <div class="date-wrapper">
          <input type="date" class="input" value="${state.newBooking.checkOut}" onchange="updateNewBooking('checkOut', this.value)" onfocus="this.showPicker()" />
          <label class="date-label">Saída</label>
        </div>
        <input type="number" class="input" placeholder="Qtd. Pessoas" value="${state.newBooking.guests}" onchange="updateNewBooking('guests', this.value)" />
        <input type="number" class="input" placeholder="Valor total" value="${state.newBooking.total}" onchange="updateNewBooking('total', this.value)" />
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 16px;">
        <input type="number" class="input" placeholder="Valor pago" value="${state.newBooking.paid}" onchange="updateNewBooking('paid', this.value)" />
        <input type="text" class="input" placeholder="Quem vendeu?" value="${state.newBooking.seller}" onchange="updateNewBooking('seller', this.value)" />
        <input type="text" class="input" placeholder="Anotações" value="${state.newBooking.note}" onchange="updateNewBooking('note', this.value)" />
      </div>
      <button class="btn" onclick="handleAdd()">
        <i data-lucide="plus"></i>
        Adicionar Reserva
      </button>
    </div>

    <div class="table-wrapper">
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Entrada</th>
              <th>Saída</th>
              <th>Pessoas</th>
              <th>Total</th>
              <th>Pago</th>
              <th>Pendente</th>
              <th>Vendedor</th>
              <th>Anotações</th>
              <th style="text-align: center;">Ações</th>
            </tr>
          </thead>
          <tbody>
            ${state.bookings.length === 0 ? `
              <tr>
                <td colspan="10" class="empty-state">
                  <div style="padding: 32px;">
                    <i data-lucide="inbox" style="width: 48px; height: 48px; opacity: 0.3; margin: 0 auto 16px; display: block;"></i>
                    <p>Nenhuma reserva cadastrada ainda</p>
                  </div>
                </td>
              </tr>
            ` : state.bookings.map(booking => `
              <tr>
                <td>
                  ${state.editingId === booking.id ? `
                    <input type="text" class="input" value="${booking.name}" onchange="updateBooking('${booking.id}', 'name', this.value)" />
                  ` : `
                    <span class="text-gray-100" style="font-weight: 600;">${booking.name}</span>
                  `}
                </td>
                <td class="text-gray-300">
                  ${state.editingId === booking.id ? `
                    <div class="date-wrapper">
                      <input type="date" class="input" value="${booking.checkIn}" onchange="updateBooking('${booking.id}', 'checkIn', this.value)" />
                      <label class="date-label">Entrada</label>
                    </div>
                  ` : fmtDate(booking.checkIn)}
                </td>
                <td class="text-gray-300">
                  ${state.editingId === booking.id ? `
                    <div class="date-wrapper">
                      <input type="date" class="input" value="${booking.checkOut}" onchange="updateBooking('${booking.id}', 'checkOut', this.value)" />
                      <label class="date-label">Saída</label>
                    </div>
                  ` : fmtDate(booking.checkOut)}
                </td>
                <td class="text-gray-300">
                  ${state.editingId === booking.id ? `
                    <input type="number" class="input" style="width: 70px;" value="${booking.guests || 0}" onchange="updateBooking('${booking.id}', 'guests', this.value)" />
                  ` : (booking.guests || 0)}
                </td>
                <td class="text-gray-300" style="font-weight: 600;">
                  ${state.editingId === booking.id ? `
                    <input type="number" class="input" style="width: 100px;" value="${booking.total}" onchange="updateBooking('${booking.id}', 'total', this.value)" />
                  ` : fmt(booking.total)}
                </td>
                <td class="text-green">
                  ${state.editingId === booking.id ? `
                    <input type="number" class="input" style="width: 100px;" value="${booking.paid}" onchange="updateBooking('${booking.id}', 'paid', this.value)" />
