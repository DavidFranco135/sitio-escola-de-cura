<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sítio Escola de Cura - Hospedagens</title>

<link rel="icon" type="image/png" sizes="32x32" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2334d399'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='white' font-family='Arial, sans-serif' font-weight='bold'>S</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2334d399'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='white' font-family='Arial, sans-serif' font-weight='bold'>S</text></svg>">
<meta name="theme-color" content="#34d399">

<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 12px;
    color: #1f2937;
}

@media (min-width: 768px) {
    body {
        padding: 24px;
    }
}

.container {
    max-width: 1400px;
    margin: 0 auto;
}

.card {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    padding: 16px;
    margin-bottom: 24px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.card:hover {
    transform: translateY(-2px);
    box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
}

@media (min-width: 768px) {
    .card {
        padding: 24px;
    }
}

.title {
    font-size: 24px;
    font-weight: 800;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 20px;
    text-align: center;
}

@media (min-width: 768px) {
    .title {
        font-size: 30px;
        margin-bottom: 24px;
    }
}

.tabs {
    display: flex;
    gap: 8px;
    border-bottom: 2px solid #e5e7eb;
    margin-bottom: 24px;
}

.tab {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    font-weight: 600;
    background: none;
    border: none;
    cursor: pointer;
    color: #6b7280;
    transition: all 0.3s ease;
    border-bottom: 3px solid transparent;
}

.tab:hover {
    color: #667eea;
    background: rgba(102, 126, 234, 0.1);
    border-radius: 8px 8px 0 0;
}

.tab.active {
    color: #667eea;
    border-bottom-color: #667eea;
}

.form-container {
    background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 24px;
    border: 2px solid rgba(102, 126, 234, 0.2);
}

.form-title {
    font-weight: 700;
    color: #667eea;
    margin-bottom: 12px;
    font-size: 18px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    margin-bottom: 12px;
}

@media (min-width: 768px) {
    .form-grid {
        grid-template-columns: repeat(5, 1fr);
    }
}

.input {
    padding: 10px 12px;
    background-color: white;
    color: #1f2937;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    font-size: 16px;
    width: 100%;
    transition: all 0.3s ease;
    font-weight: 500;
}

.input:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

.input::placeholder {
    color: #9ca3af;
}

.date-wrapper {
    position: relative;
    width: 100%;
}

.date-label {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: #9ca3af;
    pointer-events: none;
    font-size: 16px;
    transition: all 0.2s;
    z-index: 1;
    font-weight: 500;
}

.input[type="date"]:focus + .date-label,
.input[type="date"]:valid + .date-label {
    opacity: 0;
}

.input[type="date"]::-webkit-datetime-edit {
    color: transparent;
}

.input[type="date"]:focus::-webkit-datetime-edit,
.input[type="date"]:valid::-webkit-datetime-edit {
    color: #1f2937;
}

.btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 8px 24px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
}

.table-container {
    overflow-x: auto;
    max-height: 600px;
    overflow-y: auto;
    background: white;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
}

table {
    width: 100%;
    border-collapse: collapse;
}

thead {
    position: sticky;
    top: 0;
    z-index: 10;
}

thead tr {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
}

th {
    text-align: left;
    padding: 12px 8px;
    font-weight: 700;
    color: white;
    font-size: 12px;
    text-transform: uppercase;
}

tbody tr {
    border-bottom: 1px solid #f3f4f6;
    transition: all 0.2s ease;
}

tbody tr:nth-child(even) {
    background-color: #f9fafb;
}

tbody tr:hover {
    background-color: rgba(102, 126, 234, 0.05);
}

td {
    padding: 12px 8px;
    font-size: 14px;
    font-weight: 500;
}

.text-gray-100 {
    color: #1f2937;
}

.text-gray-300 {
    color: #4b5563;
}

.text-gray-400 {
    color: #6b7280;
}

.text-green {
    color: #10b981;
    font-weight: 600;
}

.text-orange {
    color: #f59e0b;
    font-weight: 600;
}

.actions {
    display: flex;
    gap: 8px;
    justify-content: center;
}

.icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    border-radius: 8px;
    transition: all 0.2s ease;
}

.icon-btn:hover {
    transform: scale(1.1);
}

.icon-btn.blue {
    color: #60a5fa;
}

.icon-btn.blue:hover {
    background: rgba(96, 165, 250, 0.1);
}

.icon-btn.red {
    color: #f87171;
}

.icon-btn.red:hover {
    background: rgba(248, 113, 113, 0.1);
}

.icon-btn.green {
    color: #34d399;
}

.icon-btn.green:hover {
    background: rgba(52, 211, 153, 0.1);
}

.icon-btn.gray {
    color: #9ca3af;
}

.icon-btn.gray:hover {
    background: rgba(156, 163, 175, 0.1);
}

.empty-state {
    text-align: center;
    padding: 48px;
    color: #9ca3af;
    font-size: 16px;
}

.schedule-container {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.schedule-title {
    font-size: 24px;
    font-weight: 700;
    color: #667eea;
    margin-bottom: 16px;
}

.schedule-card {
    background: white;
    border-radius: 16px;
    padding: 16px;
    border-left: 4px solid #667eea;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    transition: all 0.3s ease;
}

.schedule-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
}

.schedule-name {
    font-size: 18px;
    font-weight: 700;
    color: #1f2937;
    margin-bottom: 12px;
}

.schedule-grid {
    display: grid;
    gap: 8px;
    font-size: 14px;
    margin-bottom: 12px;
}

.schedule-note {
    margin-top: 12px;
    padding: 12px;
    background: rgba(102, 126, 234, 0.05);
    border-radius: 8px;
    font-size: 13px;
    color: #4b5563;
    font-style: italic;
}

.toast-container {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.toast {
    background: white;
    padding: 16px 20px;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 300px;
    animation: slideIn 0.3s ease;
    border-left: 4px solid;
}

.toast.success {
    border-left-color: #10b981;
}

.toast.error {
    border-left-color: #ef4444;
}

.toast-message {
    flex: 1;
    font-size: 14px;
    font-weight: 600;
    color: #1f2937;
}

@keyframes slideIn {
    from {
        transform: translateX(400px);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}

@keyframes slideOut {
    from {
        transform: translateX(0);
        opacity: 1;
    }
    to {
        transform: translateX(400px);
        opacity: 0;
    }
}

.toast.removing {
    animation: slideOut 0.3s ease forwards;
}
</style>
</head>

<body>
<div id="toast-container" class="toast-container"></div>
<div id="root"></div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyDIQw3v9C7FnRNf8_uuiqbx2NLvVErNke0",
  authDomain: "sitio-escola-de-cura.firebaseapp.com",
  projectId: "sitio-escola-de-cura"
});
const db = firebase.firestore();

let state = {
  activeTab: 'bookings',
  bookings: [],
  editingId: null,
  newBooking: {name: '', checkIn: '', checkOut: '', total: '', paid: '', note: '', seller: '', guests: ''}
};

function showToast(message, type = 'success') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  
  const icon = type === 'success' ? '✓' : '✕';
  const iconColor = type === 'success' ? '#10b981' : '#ef4444';
  
  toast.innerHTML = `
    <div style="color: ${iconColor}; font-size: 20px; font-weight: bold;">${icon}</div>
    <div class="toast-message">${message}</div>
  `;
  
  container.appendChild(toast);
  
  setTimeout(() => {
    toast.classList.add('removing');
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

async function loadBookings() {
  const snap = await db.collection("bookings").orderBy("checkIn").get();
  state.bookings = snap.docs.map(d => d.data());
  render();
}

async function handleAdd() {
  const b = state.newBooking;
  if (!b.name || !b.checkIn || !b.checkOut) {
    showToast('Preencha nome e datas', 'error');
    return;
  }

  const newCheckIn = new Date(b.checkIn + 'T00:00:00');
  const newCheckOut = new Date(b.checkOut + 'T00:00:00');

  const conflict = state.bookings.find(booking => {
    const existingCheckIn = new Date(booking.checkIn + 'T00:00:00');
    const existingCheckOut = new Date(booking.checkOut + 'T00:00:00');
    return !(newCheckOut <= existingCheckIn || newCheckIn >= existingCheckOut);
  });

  if (conflict) {
    showToast(`Data indisponível! Já existe reserva de ${conflict.name} entre ${fmtDate(conflict.checkIn)} e ${fmtDate(conflict.checkOut)}`, 'error');
    return;
  }

  const booking = {
    id: 'booking_' + Date.now(),
    name: b.name,
    checkIn: b.checkIn,
    checkOut: b.checkOut,
    total: +b.total || 0,
    paid: +b.paid || 0,
    pending: (+b.total || 0) - (+b.paid || 0),
    note: b.note || '',
    seller: b.seller || '',
    guests: +b.guests || 0
  };

  await db.collection("bookings").doc(booking.id).set(booking);
  state.newBooking = {name: '', checkIn: '', checkOut: '', total: '', paid: '', note: '', seller: '', guests: ''};
  showToast('Reserva cadastrada com sucesso!', 'success');
  loadBookings();
}

async function handleDelete(id) {
  if (confirm('Deseja realmente excluir esta reserva?')) {
    await db.collection("bookings").doc(id).delete();
    showToast('Reserva excluída com sucesso!', 'success');
    loadBookings();
  }
}

function handleEdit(id) {
  state.editingId = id;
  render();
}

function handleCancelEdit() {
  state.editingId = null;
  loadBookings();
}

async function handleSaveEdit(id) {
  const b = state.bookings.find(x => x.id === id);
  
  const newCheckIn = new Date(b.checkIn + 'T00:00:00');
  const newCheckOut = new Date(b.checkOut + 'T00:00:00');

  const conflict = state.bookings.find(booking => {
    if (booking.id === id) return false;
    const existingCheckIn = new Date(booking.checkIn + 'T00:00:00');
    const existingCheckOut = new Date(booking.checkOut + 'T00:00:00');
    return !(newCheckOut <= existingCheckIn || newCheckIn >= existingCheckOut);
  });

  if (conflict) {
    showToast(`Data indisponível! Já existe reserva de ${conflict.name} entre ${fmtDate(conflict.checkIn)} e ${fmtDate(conflict.checkOut)}`, 'error');
    return;
  }

  b.pending = b.total - b.paid;
  await db.collection("bookings").doc(id).set(b);
  state.editingId = null;
  showToast('Reserva atualizada com sucesso!', 'success');
  loadBookings();
}

function changeTab(t) {
  state.activeTab = t;
  render();
}

function updateNewBooking(f, v) {
  state.newBooking[f] = v;
}

function updateBooking(id, f, v) {
  const b = state.bookings.find(x => x.id === id);
  if (f === 'name' || f === 'note' || f === 'checkIn' || f === 'checkOut' || f === 'seller') {
    b[f] = v;
  } else {
    b[f] = +v || 0;
  }
}

function fmt(v) {
  return `R$ ${Math.round(v).toLocaleString('pt-BR')}`;
}

function fmtDate(d) {
  return new Date(d + 'T00:00:00').toLocaleDateString('pt-BR');
}

function renderBookingsTab() {
  return `
    <div class="form-container">
      <h2 class="form-title">Nova Reserva</h2>
      <div class="form-grid">
        <input type="text" class="input" placeholder="Nome" value="${state.newBooking.name}" onchange="updateNewBooking('name', this.value)" />
        <div class="date-wrapper">
          <input type="date" class="input" value="${state.newBooking.checkIn}" onchange="updateNewBooking('checkIn', this.value)" />
          <label class="date-label">Entrada</label>
        </div>
        <div class="date-wrapper">
          <input type="date" class="input" value="${state.newBooking.checkOut}" onchange="updateNewBooking('checkOut', this.value)" />
          <label class="date-label">Saída</label>
        </div>
        <input type="number" class="input" placeholder="Qtd. Pessoas" value="${state.newBooking.guests}" onchange="updateNewBooking('guests', this.value)" />
        <input type="number" class="input" placeholder="Valor total" value="${state.newBooking.total}" onchange="updateNewBooking('total', this.value)" />
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px;">
        <input type="number" class="input" placeholder="Valor pago" value="${state.newBooking.paid}" onchange="updateNewBooking('paid', this.value)" />
        <input type="text" class="input" placeholder="Quem vendeu?" value="${state.newBooking.seller}" onchange="updateNewBooking('seller', this.value)" />
        <input type="text" class="input" placeholder="Anotações" value="${state.newBooking.note}" onchange="updateNewBooking('note', this.value)" />
      </div>
      <button class="btn" onclick="handleAdd()">
        <i data-lucide="plus"></i>
        Adicionar
      </button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Entrada</th>
            <th>Saída</th>
            <th>Pessoas</th>
            <th>Total</th>
            <th>Pago</th>
            <th>Pendente</th>
            <th>Vendedor</th>
            <th>Anotações</th>
            <th style="text-align: center;">Ações</th>
          </tr>
        </thead>
        <tbody>
          ${state.bookings.length === 0 ? `
            <tr><td colspan="10" class="empty-state">Nenhuma reserva cadastrada</td></tr>
          ` : state.bookings.map(booking => `
            <tr>
              <td>
                ${state.editingId === booking.id ? `
                  <input type="text" class="input" value="${booking.name}" onchange="updateBooking('${booking.id}', 'name', this.value)" />
                ` : `<span class="text-gray-100" style="font-weight: 600;">${booking.name}</span>`}
              </td>
              <td class="text-gray-300">
                ${state.editingId === booking.id ? `
                  <div class="date-wrapper">
                    <input type="date" class="input" value="${booking.checkIn}" onchange="updateBooking('${booking.id}', 'checkIn', this.value)" />
                    <label class="date-label">Entrada</label>
                  </div>
                ` : fmtDate(booking.checkIn)}
              </td>
              <td class="text-gray-300">
                ${state.editingId === booking.id ? `
                  <div class="date-wrapper">
                    <input type="date" class="input" value="${booking.checkOut}" onchange="updateBooking('${booking.id}', 'checkOut', this.value)" />
                    <label class="date-label">Saída</label>
                  </div>
                ` : fmtDate(booking.checkOut)}
              </td>
              <td class="text-gray-300">
                ${state.editingId === booking.id ? `
                  <input type="number" class="input" style="width: 60px;" value="${booking.guests || 0}" onchange="updateBooking('${booking.id}', 'guests', this.value)" />
                ` : (booking.guests || 0)}
              </td>
              <td class="text-gray-300">
                ${state.editingId === booking.id ? `
                  <input type="number" class="input" style="width: 80px;" value="${booking.total}" onchange="updateBooking('${booking.id}', 'total', this.value)" />
                ` : fmt(booking.total)}
              </td>
              <td class="text-green">
                ${state.editingId === booking.id ? `
                  <input type="number" class="input" style="width: 80px;" value="${booking.paid}" onchange="updateBooking('${booking.id}', 'paid', this.value)" />
                ` : fmt(booking.paid)}
              </td>
              <td>
                <span class="${booking.pending > 0 ? 'text-orange' : 'text-green'}">
                  ${fmt(booking.pending)}
                </span>
              </td>
              <td class="text-gray-300">
                ${state.editingId === booking.id ? `
                  <input type="text" class="input" value="${booking.seller || ''}" onchange="updateBooking('${booking.id}', 'seller', this.value)" />
                ` : `<span class="text-gray-400">${booking.seller || '-'}</span>`}
              </td>
              <td class="text-gray-300">
                ${state.editingId === booking.id ? `
                  <input type="text" class="input" value="${booking.note || ''}" onchange="updateBooking('${booking.id}', 'note', this.value)" />
                ` : `<span class="text-gray-400">${booking.note || '-'}</span>`}
              </td>
              <td>
                <div class="actions">
                  ${state.editingId === booking.id ? `
                    <button class="icon-btn green" onclick="handleSaveEdit('${booking.id}')" title="Salvar">
                      <i data-lucide="check"></i>
                    </button>
                    <button class="icon-btn gray" onclick="handleCancelEdit()" title="Cancelar">
                      <i data-lucide="x"></i>
                    </button>
                  ` : `
                    <button class="icon-btn blue" onclick="handleEdit('${booking.id}')" title="Editar">
                      <i data-lucide="edit-2"></i>
                    </button>
                    <button class="icon-btn red" onclick="handleDelete('${booking.id}')" title="Excluir">
                      <i data-lucide="trash-2"></i>
                    </button>
                  `}
                </div>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function renderScheduleTab() {
  if (state.bookings.length === 0) {
    return `<div class="empty-state">Nenhum agendamento cadastrado ainda</div>`;
  }

  const sortedBookings = [...state.bookings].sort((a, b) => {
    return new Date(a.checkIn) - new Date(b.checkIn);
  });

  return `
    <h2 class="schedule-title">Calendário de Agendamentos</h2>
    <div class="schedule-container">
      ${sortedBookings.map(booking => {
        const checkIn = new Date(booking.checkIn + 'T00:00:00');
        const checkOut = new Date(booking.checkOut + 'T00:00:00');
        const days = Math.ceil((checkOut - checkIn) / (1000 * 60 * 60 * 24));
        
        return `
          <div class="schedule-card">
            <h3 class="schedule-name">${booking.name}</h3>
            <div class="schedule-grid">
              <div style="color: #6b7280;">
                <strong style="color: #1f2937;">Entrada:</strong> ${fmtDate(booking.checkIn)}
              </div>
              <div style="color: #6b7280;">
                <strong style="color: #1f2937;">Saída:</strong> ${fmtDate(booking.checkOut)}
              </div>
              <div style="color: #6b7280;">
                <strong style="color: #1f2937;">Período:</strong> ${days} ${days === 1 ? 'dia' : 'dias'}
              </div>
              <div style="color: #6b7280;">
                <strong style="color: #1f2937;">Pessoas:</strong> ${booking.guests || 0}
              </div>
            </div>
            ${booking.note ? `<div class="schedule-note">Obs: ${booking.note}</div>` : ''}
            ${booking.seller ? `<div class="schedule-note">Vendedor: ${booking.seller}</div>` : ''}
            <div style="margin-top: 16px; padding-top: 16px; border-top: 2px solid #f3f4f6; text-align: right;">

            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}
