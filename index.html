<html lang="pt-BR">
<head>

            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;

</head>
<body>
    <div id="root"></div>

    <!-- ======= SEU SCRIPT ORIGINAL (NÃO ALTERADO) ======= -->
    <script type="module">
/* ===== FIREBASE ===== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { 
  getFirestore, collection, addDoc, getDocs, deleteDoc, doc 
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDIQw3v9C7FnRNf8_uuiqbx2NLvVErNke0",
  authDomain: "sitio-escola-de-cura.firebaseapp.com",
  projectId: "sitio-escola-de-cura",
  storageBucket: "sitio-escola-de-cura.appspot.com",
  messagingSenderId: "21307520694",
  appId: "1:21307520694:web:7a9af09371d1b4d8b81817"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const reservasRef = collection(db, "reservas");

/* ===== SEU SISTEMA ===== */
let state = {
  activeTab: 'bookings',
  bookings: [],
  editingId: null,
  newBooking: {
    name: '',
    checkIn: '',
    checkOut: '',
    total: '',
    paid: '',
    note: ''
  }
};

/* 🔄 CARREGAR */
async function loadBookings() {
  state.bookings = [];
  const snap = await getDocs(reservasRef);
  snap.forEach(d => state.bookings.push({ id: d.id, ...d.data() }));
  state.bookings.sort((a,b)=>new Date(a.checkIn)-new Date(b.checkIn));
  render();
}

/* ➕ SALVAR */
async function addBooking() {
  const b = state.newBooking;
  if (!b.name || !b.checkIn || !b.checkOut) {
    alert("Preencha nome e datas");
    return;
  }

  await addDoc(reservasRef, {
    ...b,
    total: Number(b.total)||0,
    paid: Number(b.paid)||0,
    pending:(Number(b.total)||0)-(Number(b.paid)||0),
    createdAt:new Date()
  });

  state.newBooking={ name:'',checkIn:'',checkOut:'',total:'',paid:'',note:'' };
  loadBookings();
}

/* ❌ EXCLUIR */
async function deleteBooking(id) {
  if(confirm("Excluir reserva?")){
    await deleteDoc(doc(db,"reservas",id));
    loadBookings();
  }
}

document.addEventListener("DOMContentLoaded", loadBookings);
</script>



</body>
</html>
