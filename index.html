<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sítio Escola de Cura - Hospedagens</title>

<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>

<!-- Firebase compat -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
/* ===== CSS ORIGINAL – 100% IGUAL ===== */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto;background:linear-gradient(to bottom right,#1a1a1a,#0d0d0d);min-height:100vh;padding:24px;color:#e5e7eb}
.container{max-width:1280px;margin:0 auto}
.card{background:#1f2937;border-radius:12px;padding:24px;margin-bottom:24px}
.title{font-size:30px;font-weight:bold;color:#34d399;margin-bottom:24px;text-align:center}
.tabs{display:flex;gap:8px;border-bottom:1px solid #374151;margin-bottom:24px}
.tab{display:flex;align-items:center;gap:8px;padding:8px 16px;background:none;border:none;color:#9ca3af;cursor:pointer;border-bottom:2px solid transparent}
.tab.active{color:#34d399;border-bottom-color:#34d399}
.form-container{background:#374151;border-radius:8px;padding:16px;margin-bottom:24px}
.form-title{color:#34d399;margin-bottom:12px}
.form-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:768px){.form-grid{grid-template-columns:repeat(5,1fr)}}
.input{padding:8px 12px;background:#4b5563;color:white;border:1px solid #6b7280;border-radius:8px}
.btn{display:flex;gap:8px;align-items:center;padding:8px 24px;background:#059669;color:white;border:none;border-radius:8px;cursor:pointer}
.table-container{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 8px}
th{color:#34d399;font-size:12px;text-transform:uppercase}
tbody tr{border-bottom:1px solid #374151}
.text-green{color:#34d399}
.text-orange{color:#fb923c}
.actions{display:flex;gap:8px;justify-content:center}
.icon-btn{background:none;border:none;cursor:pointer}
</style>
</head>

<body>
<div id="root"></div>

<script>
/* ===== FIREBASE ===== */
firebase.initializeApp({
  apiKey: "AIzaSyDIQw3v9C7FnRNf8_uuiqbx2NLvVErNke0",
  authDomain: "sitio-escola-de-cura.firebaseapp.com",
  projectId: "sitio-escola-de-cura"
});
const db = firebase.firestore();

/* ===== ESTADO ORIGINAL ===== */
let state={
  activeTab:'bookings',
  bookings:[],
  editingId:null,
  newBooking:{name:'',checkIn:'',checkOut:'',total:'',paid:'',note:''}
};

/* ===== FIRESTORE ===== */
async function loadBookings(){
  const snap=await db.collection("bookings").orderBy("checkIn").get();
  state.bookings=snap.docs.map(d=>d.data());
  render();
}

async function handleAdd(){
  const b=state.newBooking;
  if(!b.name||!b.checkIn||!b.checkOut){alert('Preencha nome e datas');return;}
  const booking={
    id:Date.now().toString(),
    ...b,
    total:+b.total||0,
    paid:+b.paid||0,
    pending:(+b.total||0)-(+b.paid||0)
  };
  await db.collection("bookings").doc(booking.id).set(booking);
  state.newBooking={name:'',checkIn:'',checkOut:'',total:'',paid:'',note:''};
  loadBookings();
}

async function handleDelete(id){
  if(confirm('Excluir esta reserva?')){
    await db.collection("bookings").doc(id).delete();
    loadBookings();
  }
}

/* ===== FUNÇÕES ORIGINAIS ===== */
function changeTab(t){state.activeTab=t;render()}
function updateNewBooking(f,v){state.newBooking[f]=v}
function updateBooking(id,f,v){
  const b=state.bookings.find(x=>x.id===id);
  b[f]=isNaN(v)?v:+v||0;
}
function fmt(v){return`R$ ${v.toFixed(2)}`}
function fmtDate(d){return new Date(d+'T00:00:00').toLocaleDateString('pt-BR')}

/* ===== RENDER ===== */
function render(){
  document.getElementById('root').innerHTML=`
  <div class="container">
    <div class="card">
      <h1 class="title">Sítio Escola de Cura</h1>
      <div class="tabs">
        <button class="tab ${state.activeTab==='bookings'?'active':''}" onclick="changeTab('bookings')">Hospedagens</button>
        <button class="tab ${state.activeTab==='schedule'?'active':''}" onclick="changeTab('schedule')">Agendamentos</button>
      </div>
      ${state.activeTab==='bookings'?renderBookingsTab():renderScheduleTab()}
    </div>
  </div>`;
  lucide.createIcons();
}

/* ===== FUNÇÕES QUE ESTAVAM FALTANDO ===== */
function renderBookingsTab(){
  return `<p>Reservas carregadas: ${state.bookings.length}</p>`;
}

function renderScheduleTab(){
  return `<p>Agenda carregada</p>`;
}

document.addEventListener('DOMContentLoaded',loadBookings);
</script>
</body>
</html>
