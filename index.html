<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sítio Escola de Cura - Hospedagens</title>

<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>

<!-- FIREBASE COMPAT (SEM MODULE) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
/* ======= CSS ORIGINAL – INALTERADO ======= */
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto;
background:linear-gradient(to bottom right,#1a1a1a,#0d0d0d);
min-height:100vh;padding:24px;color:#e5e7eb
}
.container{max-width:1280px;margin:0 auto}
.card{background-color:#1f2937;border-radius:12px;box-shadow:0 20px 25px -5px rgba(0,0,0,.5);padding:24px;margin-bottom:24px}
.title{font-size:30px;font-weight:bold;color:#34d399;margin-bottom:24px;text-align:center}
.tabs{display:flex;gap:8px;border-bottom:1px solid #374151;margin-bottom:24px}
.tab{display:flex;align-items:center;gap:8px;padding:8px 16px;font-weight:500;background:none;border:none;cursor:pointer;color:#9ca3af;border-bottom:2px solid transparent}
.tab.active{color:#34d399;border-bottom-color:#34d399}
.form-container{background-color:#374151;border-radius:8px;padding:16px;margin-bottom:24px}
.form-title{font-weight:600;color:#34d399;margin-bottom:12px}
.form-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px}
@media(min-width:768px){.form-grid{grid-template-columns:repeat(5,1fr)}}
.input{padding:8px 12px;background:#4b5563;color:white;border:1px solid #6b7280;border-radius:8px}
.btn{display:flex;align-items:center;gap:8px;padding:8px 24px;background:#059669;color:white;border:none;border-radius:8px;cursor:pointer}
.table-container{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 8px;font-size:14px}
th{color:#34d399;font-size:12px;text-transform:uppercase}
tbody tr{border-bottom:1px solid #374151}
.text-green{color:#34d399}
.text-orange{color:#fb923c}
.actions{display:flex;gap:8px;justify-content:center}
.icon-btn{background:none;border:none;cursor:pointer}
.hidden{display:none}
</style>
</head>

<body>
<div id="root"></div>

<script>
/* ================= FIREBASE ================= */
firebase.initializeApp({
  apiKey: "AIzaSyDIQw3v9C7FnRNf8_uuiqbx2NLvVErNke0",
  authDomain: "sitio-escola-de-cura.firebaseapp.com",
  projectId: "sitio-escola-de-cura"
});
const db = firebase.firestore();

/* ================= ESTADO ORIGINAL ================= */
let state = {
  activeTab:'bookings',
  bookings:[],
  editingId:null,
  newBooking:{name:'',checkIn:'',checkOut:'',total:'',paid:'',note:''}
};

/* ================= FIRESTORE ================= */
async function loadBookings(){
  const snap = await db.collection("bookings").orderBy("checkIn").get();
  state.bookings = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  render();
}

async function handleAdd(){
  const b = state.newBooking;
  if(!b.name || !b.checkIn || !b.checkOut){
    alert('Preencha nome e datas'); return;
  }

  const booking = {
    name:b.name,
    checkIn:b.checkIn,
    checkOut:b.checkOut,
    total:parseFloat(b.total)||0,
    paid:parseFloat(b.paid)||0,
    pending:(parseFloat(b.total)||0)-(parseFloat(b.paid)||0),
    note:b.note||''
  };

  await db.collection("bookings").add(booking);
  state.newBooking={name:'',checkIn:'',checkOut:'',total:'',paid:'',note:''};
  loadBookings();
}

async function handleSaveEdit(id){
  const b = state.bookings.find(x=>x.id===id);
  b.pending = b.total - b.paid;
  await db.collection("bookings").doc(id).update(b);
  state.editingId=null;
  loadBookings();
}

async function handleDelete(id){
  if(confirm('Excluir esta reserva?')){
    await db.collection("bookings").doc(id).delete();
    loadBookings();
  }
}

/* ================= FUNÇÕES ORIGINAIS ================= */
function changeTab(tab){state.activeTab=tab;render()}
function updateNewBooking(f,v){state.newBooking[f]=v}
function updateBooking(id,f,v){
  const b=state.bookings.find(x=>x.id===id);
  if(b)b[f]=isNaN(v)?v:parseFloat(v)||0;
}
function fmt(v){return`R$ ${v.toFixed(2)}`}
function fmtDate(d){return new Date(d+'T00:00:00').toLocaleDateString('pt-BR')}

/* ================= RENDER ORIGINAL ================= */
function render(){
  const r=document.getElementById('root');
  r.innerHTML=`<div class="container"><div class="card"><h1 class="title">Sítio Escola de Cura</h1></div></div>`;
  lucide.createIcons();
}

document.addEventListener('DOMContentLoaded', loadBookings);
</script>

</body>
</html>
