<style>

body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto;background:linear-gradient(to bottom right,#1a1a1a,#0d0d0d);min-height:100vh;padding:24px;color:#e5e7eb}

<body>
<div id="root"></div>

<script>
/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "SUA_API_KEY",
  authDomain: "SEU_PROJETO.firebaseapp.com",
  projectId: "SEU_PROJETO"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ================= STATE ================= */
let state = {
  activeTab: 'bookings',
  bookings: [],
  editingId: null,
  newBooking: {
    name: '',
    checkIn: '',
    checkOut: '',
    total: '',
    paid: '',
    note: ''
  }
};

/* ================= LOAD ================= */
async function loadBookings() {
  const snapshot = await db.collection("bookings")
    .orderBy("checkIn")
    .get();

  state.bookings = snapshot.docs.map(doc => doc.data());
  render();
}

/* ================= ADD ================= */
async function handleAdd() {
  const { name, checkIn, checkOut, total, paid, note } = state.newBooking;

  if (!name || !checkIn || !checkOut) {
    alert('Preencha nome e datas');
    return;
  }

  const booking = {
    id: `booking_${Date.now()}`,
    name,
    checkIn,
    checkOut,
    total: Number(total) || 0,
    paid: Number(paid) || 0,
    pending: (Number(total) || 0) - (Number(paid) || 0),
    note: note || ''
  };

  await db.collection("bookings").doc(booking.id).set(booking);

  state.newBooking = { name:'', checkIn:'', checkOut:'', total:'', paid:'', note:'' };
  loadBookings();
}

/* ================= EDIT ================= */
function handleEdit(id){
  state.editingId=id;
  render();
}

async function handleSaveEdit(id){
  const booking = state.bookings.find(b=>b.id===id);
  booking.pending = booking.total - booking.paid;

  await db.collection("bookings").doc(id).update(booking);
  state.editingId=null;
  loadBookings();
}

function handleCancelEdit(){
  state.editingId=null;
  loadBookings();
}

/* ================= DELETE ================= */
async function handleDelete(id){
  if(confirm("Excluir esta reserva?")){
    await db.collection("bookings").doc(id).delete();
    loadBookings();
  }
}

/* ================= HELPERS ================= */
function updateNewBooking(f,v){state.newBooking[f]=v}
function updateBooking(id,f,v){
  const b=state.bookings.find(x=>x.id===id);
  b[f]=['name','note','checkIn','checkOut'].includes(f)?v:Number(v)||0;
}
function changeTab(t){state.activeTab=t;render()}
function fmt(v){return `R$ ${v.toFixed(2)}`}
function fmtDate(d){return new Date(d+'T00:00:00').toLocaleDateString('pt-BR')}

/* ================= RENDER ================= */
/* 🔒 SUA FUNÇÃO render / renderBookingsTab / renderScheduleTab
   FICA IGUAL À ORIGINAL – NÃO PRECISA ALTERAR NADA */
</script>

<script>
document.addEventListener("DOMContentLoaded", loadBookings);
</script>
</body>
