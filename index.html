<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

* {

}

:root {

body::before {

tbody tr {

td {

}

.icon-btn:hover {

}

.icon-btn.blue {
    color: var(--blue);

}

.icon-btn.blue:hover {

.schedule-container {

.schedule-title {

.schedule-card {

<body>
<div id="root"></div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyDIQw3v9C7FnRNf8_uuiqbx2NLvVErNke0",
  authDomain: "sitio-escola-de-cura.firebaseapp.com",
  projectId: "sitio-escola-de-cura"
});
const db = firebase.firestore();

let state = {
  activeTab: 'bookings',
  bookings: [],
  editingId: null,
  newBooking: {name: '', checkIn: '', checkOut: '', total: '', paid: '', note: '', seller: '', guests: ''}
};

async function loadBookings() {
  const snap = await db.collection("bookings").orderBy("checkIn").get();
  state.bookings = snap.docs.map(d => d.data());
  render();
}

async function handleAdd() {
  const b = state.newBooking;
  if (!b.name || !b.checkIn || !b.checkOut) {
    alert('Preencha nome e datas');
    return;
  }

  const newCheckIn = new Date(b.checkIn + 'T00:00:00');
  const newCheckOut = new Date(b.checkOut + 'T00:00:00');

  const conflict = state.bookings.find(booking => {
    const existingCheckIn = new Date(booking.checkIn + 'T00:00:00');
    const existingCheckOut = new Date(booking.checkOut + 'T00:00:00');
    return !(newCheckOut <= existingCheckIn || newCheckIn >= existingCheckOut);
  });

  if (conflict) {
    alert(`Data indisponível! Já existe uma reserva de ${conflict.name} entre ${fmtDate(conflict.checkIn)} e ${fmtDate(conflict.checkOut)}`);
    return;
  }

  const booking = {
    id: 'booking_' + Date.now(),
    name: b.name,
    checkIn: b.checkIn,
    checkOut: b.checkOut,
    total: +b.total || 0,
    paid: +b.paid || 0,
    pending: (+b.total || 0) - (+b.paid || 0),
    note: b.note || '',
    seller: b.seller || '',
    guests: +b.guests || 0
  };

  await db.collection("bookings").doc(booking.id).set(booking);
  state.newBooking = {name: '', checkIn: '', checkOut: '', total: '', paid: '', note: '', seller: '', guests: ''};
  loadBookings();
}

async function handleDelete(id) {
  if (confirm('Excluir esta reserva?')) {
    await db.collection("bookings").doc(id).delete();
    loadBookings();
  }
}

function handleEdit(id) {
  state.editingId = id;
  render();
}

function handleCancelEdit() {
  state.editingId = null;
  loadBookings();
}

async function handleSaveEdit(id) {
  const b = state.bookings.find(x => x.id === id);
  
  const newCheckIn = new Date(b.checkIn + 'T00:00:00');
  const newCheckOut = new Date(b.checkOut + 'T00:00:00');

  const conflict = state.bookings.find(booking => {
    if (booking.id === id) return false;
    
    const existingCheckIn = new Date(booking.checkIn + 'T00:00:00');
    const existingCheckOut = new Date(booking.checkOut + 'T00:00:00');
    return !(newCheckOut <= existingCheckIn || newCheckIn >= existingCheckOut);
  });

  if (conflict) {
    alert(`Data indisponível! Já existe uma reserva de ${conflict.name} entre ${fmtDate(conflict.checkIn)} e ${fmtDate(conflict.checkOut)}`);
    return;
  }

  b.pending = b.total - b.paid;
  await db.collection("bookings").doc(id).set(b);
  state.editingId = null;
  loadBookings();
}

function changeTab(t) {
  state.activeTab = t;
  render();
}

function updateNewBooking(f, v) {
  state.newBooking[f] = v;
}

function updateBooking(id, f, v) {
  const b = state.bookings.find(x => x.id === id);
  if (f === 'name' || f === 'note' || f === 'checkIn' || f === 'checkOut' || f === 'seller') {
    b[f] = v;
  } else {
    b[f] = +v || 0;
  }
}

function fmt(v) {
  return `R$ ${Math.round(v).toLocaleString('pt-BR')}`;
}

function fmtDate(d) {
  return new Date(d + 'T00:00:00').toLocaleDateString('pt-BR');
}

function isEventCompleted(checkOutDate) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const checkOut = new Date(checkOutDate + 'T00:00:00');
  return checkOut < today;
}

function getEventStatus(checkInDate, checkOutDate) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const checkIn = new Date(checkInDate + 'T00:00:00');
  const checkOut = new Date(checkOutDate + 'T00:00:00');
  
  if (checkOut < today) {
    return { status: 'Realizado', color: 'text-gray-400' };
  } else if (checkIn <= today && checkOut >= today) {
    return { status: 'Em andamento', color: 'text-blue' };
  } else {
    return { status: 'Agendado', color: 'text-green' };
  }
}

function renderBookingsTab() {
  return `
    <div class="form-container">
      <h2 class="form-title">
        <i data-lucide="plus-circle" style="width: 20px; height: 20px;"></i>
        Nova Reserva
      </h2>
      <div class="form-grid">
        <input type="text" class="input" placeholder="Nome" value="${state.newBooking.name}" onchange="updateNewBooking('name', this.value)" />
        <div class="date-wrapper">
          <input type="date" class="input" value="${state.newBooking.checkIn}" onchange="updateNewBooking('checkIn', this.value)" onfocus="this.showPicker()" />
          <label class="date-label">Entrada</label>
        </div>
        <div class="date-wrapper">
          <input type="date" class="input" value="${state.newBooking.checkOut}" onchange="updateNewBooking('checkOut', this.value)" onfocus="this.showPicker()" />
          <label class="date-label">Saída</label>
        </div>
        <input type="number" class="input" placeholder="Qtd. Pessoas" value="${state.newBooking.guests}" onchange="updateNewBooking('guests', this.value)" />
        <input type="number" class="input" placeholder="Valor total" value="${state.newBooking.total}" onchange="updateNewBooking('total', this.value)" />
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-bottom: 14px;">
        <input type="number" class="input" placeholder="Valor pago" value="${state.newBooking.paid}" onchange="updateNewBooking('paid', this.value)" />
        <input type="text" class="input" placeholder="Quem vendeu?" value="${state.newBooking.seller}" onchange="updateNewBooking('seller', this.value)" />
        <input type="text" class="input" placeholder="Anotações (opcional)" value="${state.newBooking.note}" onchange="updateNewBooking('note', this.value)" />
      </div>
      <button class="btn" onclick="handleAdd()">
        <i data-lucide="plus"></i>
        <span>Adicionar</span>
      </button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Entrada</th>
            <th>Saída</th>
            <th>Pessoas</th>
            <th>Total</th>
            <th>Pago</th>
            <th>Pendente</th>
            <th>Status</th>
            <th>Vendedor</th>
            <th>Anotações</th>
            <th style="text-align: center;">Ações</th>
          </tr>
        </thead>
        <tbody>
          ${state.bookings.length === 0 ? `
            <tr>
              <td colspan="10" class="empty-state">Nenhuma reserva cadastrada</td>
            </tr>
          ` : state.bookings.map(booking => `
            <tr>
              <td>
                ${state.editingId === booking.id ? `
