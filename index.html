<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sítio Escola de Cura - Hospedagens</title>

<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
/* ====== SEU CSS ORIGINAL (INALTERADO) ====== */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto;background:linear-gradient(to bottom right,#1a1a1a,#0d0d0d);min-height:100vh;padding:24px;color:#e5e7eb}
.container{max-width:1280px;margin:0 auto}
.card{background:#1f2937;border-radius:12px;box-shadow:0 20px 25px -5px rgba(0,0,0,.5);padding:24px;margin-bottom:24px}
.title{font-size:30px;font-weight:bold;color:#34d399;margin-bottom:24px;text-align:center}
.tabs{display:flex;gap:8px;border-bottom:1px solid #374151;margin-bottom:24px}
.tab{display:flex;align-items:center;gap:8px;padding:8px 16px;font-weight:500;background:none;border:none;cursor:pointer;color:#9ca3af;border-bottom:2px solid transparent}
.tab.active{color:#34d399;border-bottom-color:#34d399}
.form-container{background:#374151;border-radius:8px;padding:16px;margin-bottom:24px}
.form-title{font-weight:600;color:#34d399;margin-bottom:12px}
.form-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px}
@media(min-width:768px){.form-grid{grid-template-columns:repeat(5,1fr)}}
.input{padding:8px 12px;background:#4b5563;color:white;border:1px solid #6b7280;border-radius:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 24px;background:#059669;color:white;border:none;border-radius:8px;cursor:pointer}
.table-container{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 8px}
th{color:#34d399;font-size:12px;text-transform:uppercase}
tbody tr{border-bottom:1px solid #374151}
.actions{display:flex;gap:8px;justify-content:center}
.icon-btn{background:none;border:none;cursor:pointer}
.text-green{color:#34d399}
.text-orange{color:#fb923c}
.empty-state{text-align:center;padding:32px;color:#9ca3af}
.hidden{display:none}
</style>
</head>

<body>
<div id="root"></div>

<script>
/* ================= FIREBASE CONFIG ================= */
const firebaseConfig = {
  apiKey: "SUA_API_KEY",
  authDomain: "SEU_PROJETO.firebaseapp.com",
  projectId: "SEU_PROJETO"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ================= STATE ================= */
let state = {
  activeTab: 'bookings',
  bookings: [],
  editingId: null,
  newBooking: { name:'', checkIn:'', checkOut:'', total:'', paid:'', note:'' }
};

/* ================= LOAD ================= */
async function loadBookings(){
  const snap = await db.collection("bookings").orderBy("checkIn").get();
  state.bookings = snap.docs.map(d=>d.data());
  render();
}

/* ================= ADD ================= */
async function handleAdd(){
  const b = state.newBooking;
  if(!b.name||!b.checkIn||!b.checkOut){alert("Preencha nome e datas");return}

  const booking = {
    id:`booking_${Date.now()}`,
    ...b,
    total:Number(b.total)||0,
    paid:Number(b.paid)||0,
    pending:(Number(b.total)||0)-(Number(b.paid)||0)
  };

  await db.collection("bookings").doc(booking.id).set(booking);
  state.newBooking={name:'',checkIn:'',checkOut:'',total:'',paid:'',note:''};
  loadBookings();
}

/* ================= EDIT ================= */
async function handleSaveEdit(id){
  const b = state.bookings.find(x=>x.id===id);
  b.pending=b.total-b.paid;
  await db.collection("bookings").doc(id).update(b);
  state.editingId=null;
  loadBookings();
}

/* ================= DELETE ================= */
async function handleDelete(id){
  if(confirm("Excluir reserva?")){
    await db.collection("bookings").doc(id).delete();
    loadBookings();
  }
}

/* ================= HELPERS ================= */
function updateNewBooking(f,v){state.newBooking[f]=v}
function updateBooking(id,f,v){
  const b=state.bookings.find(x=>x.id===id);
  b[f]=['name','note','checkIn','checkOut'].includes(f)?v:Number(v)||0;
}
function changeTab(t){state.activeTab=t;render()}
function fmt(v){return `R$ ${v.toFixed(2)}`}
function fmtDate(d){return new Date(d+'T00:00:00').toLocaleDateString('pt-BR')}

/* ================= RENDER ================= */
function render(){
  document.getElementById("root").innerHTML=`
  <div class="container">
    <div class="card">
      <h1 class="title">Sítio Escola de Cura</h1>
      <div class="tabs">
        <button class="tab ${state.activeTab==='bookings'?'active':''}" onclick="changeTab('bookings')">Hospedagens</button>
        <button class="tab ${state.activeTab==='schedule'?'active':''}" onclick="changeTab('schedule')">Agendamentos</button>
      </div>
      ${state.activeTab==='bookings'?renderBookings():renderSchedule()}
    </div>
  </div>`;
  lucide.createIcons();
}

function renderBookings(){
return `
<div class="form-container">
<h2 class="form-title">Nova Reserva</h2>
<div class="form-grid">
<input class="input" placeholder="Nome" onchange="updateNewBooking('name',this.value)">
<input type="date" class="input" onchange="updateNewBooking('checkIn',this.value)">
<input type="date" class="input" onchange="updateNewBooking('checkOut',this.value)">
<input class="input" placeholder="Total" onchange="updateNewBooking('total',this.value)">
<input class="input" placeholder="Pago" onchange="updateNewBooking('paid',this.value)">
</div>
<input class="input" placeholder="Anotações" onchange="updateNewBooking('note',this.value)">
<button class="btn" onclick="handleAdd()">Adicionar</button>
</div>`;
}

function renderSchedule(){
return state.bookings.length===0
?`<div class="empty-state">Nenhum agendamento</div>`
:`<div>${state.bookings.map(b=>`<p>${b.name} - ${fmtDate(b.checkIn)}</p>`).join('')}</div>`;
}

document.addEventListener("DOMContentLoaded",loadBookings);
</script>
</body>
</html>
