<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sítio Escola de Cura - Hospedagens</title>

<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
/* ===== SEU CSS ORIGINAL (INALTERADO) ===== */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto;background:linear-gradient(to bottom right,#1a1a1a,#0d0d0d);min-height:100vh;padding:24px;color:#e5e7eb}
.container{max-width:1280px;margin:0 auto}
.card{background:#1f2937;border-radius:12px;padding:24px}
.title{font-size:30px;font-weight:bold;color:#34d399;text-align:center;margin-bottom:24px}
.tabs{display:flex;gap:8px;border-bottom:1px solid #374151;margin-bottom:24px}
.tab{background:none;border:none;color:#9ca3af;padding:8px 16px;cursor:pointer}
.tab.active{color:#34d399;border-bottom:2px solid #34d399}
.hidden{display:none}
.input{width:100%;padding:10px;border-radius:8px;border:1px solid #6b7280;background:#4b5563;color:white;margin-bottom:10px}
.btn{background:#059669;color:white;border:none;padding:10px;border-radius:8px;cursor:pointer}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginCard" class="container">
  <div class="card" style="max-width:400px;margin:auto">
    <h1 class="title">Login</h1>
    <input id="email" class="input" placeholder="Email">
    <input id="password" type="password" class="input" placeholder="Senha">
    <button class="btn" onclick="login()">Entrar</button>
    <p id="loginError" style="color:#f87171;margin-top:10px"></p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div id="root"></div>
</div>

<script>
/* ===== FIREBASE CONFIG ===== */
const firebaseConfig = {
  apiKey: "SUA_API_KEY",
  authDomain: "SEU_PROJETO.firebaseapp.com",
  projectId: "SEU_PROJETO",
  storageBucket: "SEU_PROJETO.appspot.com",
  messagingSenderId: "XXXX",
  appId: "XXXX"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

/* ===== AUTH ===== */
function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  auth.signInWithEmailAndPassword(email, password)
    .catch(e => document.getElementById('loginError').innerText = e.message);
}

auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById('loginCard').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    loadBookings();
  } else {
    document.getElementById('loginCard').classList.remove('hidden');
    document.getElementById('app').classList.add('hidden');
  }
});

/* ===== STATE ===== */
let state = {
  activeTab: 'bookings',
  bookings: []
};

/* ===== FIRESTORE ===== */
async function loadBookings() {
  const snap = await db.collection('bookings').orderBy('checkIn').get();
  state.bookings = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  render();
}

function addBooking(data) {
  db.collection('bookings').add(data);
}

/* ===== RENDER ===== */
function render() {
  document.getElementById('root').innerHTML = `
    <div class="container">
      <div class="card">
        <h1 class="title">Sítio Escola de Cura</h1>

        <div class="tabs">
          <button class="tab ${state.activeTab==='bookings'?'active':''}" onclick="state.activeTab='bookings';render()">Hospedagens</button>
          <button class="tab ${state.activeTab==='schedule'?'active':''}" onclick="state.activeTab='schedule';render()">Agendamentos</button>
        </div>

        ${state.activeTab === 'bookings' ? renderBookings() : renderSchedule()}
      </div>
    </div>
  `;
  lucide.createIcons();
}

function renderBookings() {
  return `
    <button class="btn" onclick="addBooking({
      name:'Teste',
      checkIn:'2024-01-01',
      checkOut:'2024-01-02',
      total:100,
      paid:50,
      pending:50
    })">Adicionar teste</button>
  `;
}

function renderSchedule() {
  return `<p>Agendamentos (${state.bookings.length})</p>`;
}
</script>
</body>
</html>
