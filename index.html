<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sítio Escola de Cura - Reservas</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#111;
  color:#eee;
  padding:20px;
}
h1{margin-bottom:20px}
input,textarea,button{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border-radius:6px;
  border:none;
}
button{
  background:#16a34a;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}
button:hover{opacity:.9}
.card{
  background:#1f2937;
  padding:15px;
  border-radius:10px;
  margin-bottom:10px;
}
.delete{
  background:#dc2626;
  margin-top:8px;
}
</style>
</head>

<body>

<h1>📅 Reservas - Sítio Escola de Cura</h1>

<div class="card">
  <input id="name" placeholder="Nome do hóspede">
  <input id="checkIn" type="date">
  <input id="checkOut" type="date">
  <input id="total" type="number" placeholder="Valor total">
  <input id="paid" type="number" placeholder="Valor pago">
  <textarea id="note" placeholder="Observações"></textarea>
  <button onclick="addBooking()">Salvar Reserva</button>
</div>

<div id="list"></div>

<!-- 🔥 FIREBASE + SISTEMA -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, getDocs, deleteDoc, doc
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 CONFIG FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyDIQw3v9C7FnRNf8_uuiqbx2NLvVErNke0",
  authDomain: "sitio-escola-de-cura.firebaseapp.com",
  projectId: "sitio-escola-de-cura",
  storageBucket: "sitio-escola-de-cura.appspot.com",
  messagingSenderId: "21307520694",
  appId: "1:21307520694:web:7a9af09371d1b4d8b81817"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const reservasRef = collection(db,"reservas");

/* 🔄 LISTAR */
async function loadBookings(){
  const list = document.getElementById("list");
  list.innerHTML = "";
  const snap = await getDocs(reservasRef);

  snap.forEach(d=>{
    const b = d.data();
    const div = document.createElement("div");
    div.className="card";
    div.innerHTML=`
      <strong>${b.name}</strong><br>
      📅 ${b.checkIn} → ${b.checkOut}<br>
      💰 Total: R$ ${b.total} | Pago: R$ ${b.paid}<br>
      📝 ${b.note || ""}
      <button class="delete" onclick="deleteBooking('${d.id}')">Excluir</button>
    `;
    list.appendChild(div);
  });
}

/* ➕ SALVAR */
window.addBooking = async ()=>{
  const booking={
    name:name.value,
    checkIn:checkIn.value,
    checkOut:checkOut.value,
    total:Number(total.value)||0,
    paid:Number(paid.value)||0,
    note:note.value,
    createdAt:new Date()
  };

  if(!booking.name||!booking.checkIn||!booking.checkOut){
    alert("Preencha nome e datas");
    return;
  }

  await addDoc(reservasRef,booking);

  name.value=checkIn.value=checkOut.value=total.value=paid.value=note.value="";
  loadBookings();
}

/* ❌ EXCLUIR */
window.deleteBooking = async (id)=>{
  if(confirm("Excluir reserva?")){
    await deleteDoc(doc(db,"reservas",id));
    loadBookings();
  }
}

loadBookings();
</script>

</body>
</html>
