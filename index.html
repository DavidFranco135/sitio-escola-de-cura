<body>
<div id="root"></div>

<script>
// Firebase
firebase.initializeApp({
  apiKey: "AIzaSyDIQw3v9C7FnRNf8_uuiqbx2NLvVErNke0",
  authDomain: "sitio-escola-de-cura.firebaseapp.com",
  projectId: "sitio-escola-de-cura"
});
const db = firebase.firestore();

// Estado
let state = {
  activeTab: 'bookings',
  bookings: [],
  editingId: null,
  newBooking: {name: '', checkIn: '', checkOut: '', total: '', paid: '', note: '', seller: '', guests: ''}
};

// Firestore
async function loadBookings() {
  const snap = await db.collection("bookings").orderBy("checkIn").get();
  state.bookings = snap.docs.map(d => d.data());
  render();
}

async function handleAdd() {
  const b = state.newBooking;
  if (!b.name || !b.checkIn || !b.checkOut) {
    alert('Preencha nome e datas');
    return;
  }

  const newCheckIn = new Date(b.checkIn + 'T00:00:00');
  const newCheckOut = new Date(b.checkOut + 'T00:00:00');

  const conflict = state.bookings.find(booking => {
    const existingCheckIn = new Date(booking.checkIn + 'T00:00:00');
    const existingCheckOut = new Date(booking.checkOut + 'T00:00:00');
    return !(newCheckOut <= existingCheckIn || newCheckIn >= existingCheckOut);
  });

  if (conflict) {
    alert(`Data indisponível! Já existe uma reserva de ${conflict.name} entre ${fmtDate(conflict.checkIn)} e ${fmtDate(conflict.checkOut)}`);
    return;
  }

  const booking = {
    id: 'booking_' + Date.now(),
    name: b.name,
    checkIn: b.checkIn,
    checkOut: b.checkOut,
    total: +b.total || 0,
    paid: +b.paid || 0,
    pending: (+b.total || 0) - (+b.paid || 0),
    note: b.note || '',
    seller: b.seller || '',
    guests: +b.guests || 0
  };

  await db.collection("bookings").doc(booking.id).set(booking);
  state.newBooking = {name: '', checkIn: '', checkOut: '', total: '', paid: '', note: '', seller: '', guests: ''};
  loadBookings();
}

async function handleDelete(id) {
  if (confirm('Excluir esta reserva?')) {
    await db.collection("bookings").doc(id).delete();
    loadBookings();
  }
}

function handleEdit(id) {
  state.editingId = id;
  render();
}

function handleCancelEdit() {
  state.editingId = null;
  loadBookings();
}

async function handleSaveEdit(id) {
  const b = state.bookings.find(x => x.id === id);
  
  const newCheckIn = new Date(b.checkIn + 'T00:00:00');
  const newCheckOut = new Date(b.checkOut + 'T00:00:00');

  const conflict = state.bookings.find(booking => {
    if (booking.id === id) return false;
    
    const existingCheckIn = new Date(booking.checkIn + 'T00:00:00');
    const existingCheckOut = new Date(booking.checkOut + 'T00:00:00');
    return !(newCheckOut <= existingCheckIn || newCheckIn >= existingCheckOut);
  });

  if (conflict) {
    alert(`Data indisponível! Já existe uma reserva de ${conflict.name} entre ${fmtDate(conflict.checkIn)} e ${fmtDate(conflict.checkOut)}`);
    return;
  }

  b.pending = b.total - b.paid;
  await db.collection("bookings").doc(id).set(b);
  state.editingId = null;
  loadBookings();
}

// Helpers
function changeTab(t) {
  state.activeTab = t;
  render();
}

function updateNewBooking(f, v) {
  state.newBooking[f] = v;
}

function updateBooking(id, f, v) {
  const b = state.bookings.find(x => x.id === id);
  if (f === 'name' || f === 'note' || f === 'checkIn' || f === 'checkOut' || f === 'seller') {
    b[f] = v;
  } else {
    b[f] = +v || 0;
  }
}

function fmt(v) {
  return `R$ ${Math.round(v).toLocaleString('pt-BR')}`;
}

function fmtDate(d) {
  return new Date(d + 'T00:00:00').toLocaleDateString('pt-BR');
}

function getEventStatus(checkInDate, checkOutDate) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const checkIn = new Date(checkInDate + 'T00:00:00');
  const checkOut = new Date(checkOutDate + 'T00:00:00');
  
  if (checkOut < today) {
    return { status: 'Realizado', color: 'gray', icon: 'check-circle' };
  } else if (checkIn <= today && checkOut >= today) {
    return { status: 'Em andamento', color: 'blue', icon: 'play-circle' };
  } else {
    return { status: 'Agendado', color: 'green', icon: 'calendar-check' };
  }
}

// Render Bookings
function renderBookingsTab() {
  return `
    <div class="form-container animate-fade-in">
      <h2 class="form-title">
        <i data-lucide="plus-circle" style="width: 24px; height: 24px;"></i>
        Nova Reserva
      </h2>
      <div class="form-grid">
        <div class="input-group">
          <label class="input-label">Nome</label>
          <input type="text" class="input" placeholder="Digite o nome" value="${state.newBooking.name}" onchange="updateNewBooking('name', this.value)" />
        </div>
        <div class="input-group">
          <label class="input-label">Check-in</label>
          <input type="date" class="input" value="${state.newBooking.checkIn}" onchange="updateNewBooking('checkIn', this.value)" />
        </div>
        <div class="input-group">
          <label class="input-label">Check-out</label>
          <input type="date" class="input" value="${state.newBooking.checkOut}" onchange="updateNewBooking('checkOut', this.value)" />
        </div>
        <div class="input-group">
          <label class="input-label">Pessoas</label>
          <input type="number" class="input" placeholder="0" value="${state.newBooking.guests}" onchange="updateNewBooking('guests', this.value)" />
        </div>
        <div class="input-group">
          <label class="input-label">Valor Total</label>
          <input type="number" class="input" placeholder="R$ 0,00" value="${state.newBooking.total}" onchange="updateNewBooking('total', this.value)" />
        </div>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 16px;">
        <div class="input-group">
          <label class="input-label">Valor Pago</label>
          <input type="number" class="input" placeholder="R$ 0,00" value="${state.newBooking.paid}" onchange="updateNewBooking('paid', this.value)" />
        </div>
        <div class="input-group">
          <label class="input-label">Vendedor</label>
          <input type="text" class="input" placeholder="Quem vendeu?" value="${state.newBooking.seller}" onchange="updateNewBooking('seller', this.value)" />
        </div>
        <div class="input-group">
          <label class="input-label">Observações</label>
          <input type="text" class="input" placeholder="Opcional" value="${state.newBooking.note}" onchange="updateNewBooking('note', this.value)" />
        </div>
      </div>
      <button class="btn" onclick="handleAdd()">
        <i data-lucide="plus"></i>
        Adicionar Reserva
      </button>
    </div>

    <div class="table-container animate-fade-in">
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Entrada</th>
            <th>Saída</th>
            <th>Pessoas</th>
            <th>Total</th>
            <th>Pago</th>
            <th>Pendente</th>
            <th>Status</th>
            <th>Vendedor</th>
            <th>Anotações</th>
            <th style="text-align: center;">Ações</th>
          </tr>
        </thead>
        <tbody>
          ${state.bookings.length === 0 ? `
            <tr>
              <td colspan="11" class="empty-state">
                <i data-lucide="inbox" style="width: 48px; height: 48px; opacity: 0.3; margin-bottom: 12px;"></i>
                <p>Nenhuma reserva cadastrada</p>
              </td>
            </tr>
          ` : state.bookings.map(booking => {
            const eventStatus = getEventStatus(booking.checkIn, booking.checkOut);
            return `
            <tr>
              <td>
                ${state.editingId === booking.id ? `
                  <input type="text" class="input" value="${booking.name}" onchange="updateBooking('${booking.id}', 'name', this.value)" />
                ` : `
                  <span class="text-gray-100" style="font-weight: 600;">${booking.name}</span>
                `}
              </td>
              <td class="text-gray-300">
                ${state.editingId === booking.id ? `
                  <input type="date" class="input" value="${booking.checkIn}" onchange="updateBooking('${booking.id}', 'checkIn', this.value)" />
                ` : fmtDate(booking.checkIn)}
              </td>
              <td class="text-gray-300">
                ${state.editingId === booking.id ? `
                  <input type="date" class="input" value="${booking.checkOut}" onchange="updateBooking('${booking.id}', 'checkOut', this.value)" />
                ` : fmtDate(booking.checkOut)}
              </td>
              <td class="text-gray-300">
                ${state.editingId === booking.id ? `
                  <input type="number" class="input" style="width: 70px;" value="${booking.guests || 0}" onchange="updateBooking('${booking.id}', 'guests', this.value)" />
                ` : (booking.guests || 0)}
              </td>
              <td class="text-gray-300">
                ${state.editingId === booking.id ? `
                  <input type="number" class="input" style="width: 100px;" value="${booking.total}" onchange="updateBooking('${booking.id}', 'total', this.value)" />
                ` : fmt(booking.total)}
              </td>
              <td class="text-green">
                ${state.editingId === booking.id ? `
                  <input type="number" class="input" style="width: 100px;" value="${booking.paid}" onchange="updateBooking('${booking.id}', 'paid', this.value)" />
                ` : fmt(booking.paid)}
              </td>
              <td>
                <span class="${booking.pending > 0 ? 'text-orange' : 'text-green'}">
                  ${fmt(booking.pending)}
                </span>
              </td>
              <td>
                <span class="badge ${eventStatus.color}">
                  <i data-lucide="${eventStatus.icon}" style="width: 14px; height: 14px;"></i>
                  ${eventStatus.status}
                </span>
              </td>
              <td class="text-gray-300">
                ${state.editingId === booking.id ? `
                  <input type="text" class="input" placeholder="Vendedor" value="${booking.seller || ''}" onchange="updateBooking('${booking.id}', 'seller', this.value)" />
                ` : `<span class="text-gray-400">${booking.seller || '-'}</span>`}
              </td>
              <td class="text-gray-300">
                ${state.editingId === booking.id ? `
                  <input type="text" class="input" placeholder="Anotação" value="${booking.note || ''}" onchange="updateBooking('${booking.id}', 'note', this.value)" />
                ` : `<span class="text-gray-400">${booking.note || '-'}</span>`}
              </td>
              <td>
                <div class="actions">
                  ${state.editingId === booking.id ? `
                    <button class="icon-btn green" onclick="handleSaveEdit('${booking.id}')" title="Salvar">
                      <i data-lucide="check"></i>
                    </button>
                    <button class="icon-btn gray" onclick="handleCancelEdit()" title="Cancelar">
                      <i data-lucide="x"></i>
                    </button>
                  ` : `
                    <button class="icon-btn blue" onclick="handleEdit('${booking.id}')" title="Editar">
                      <i data-lucide="edit-2"></i>
                    </button>
                    <button class="icon-btn red" onclick="handleDelete('${booking.id}')" title="Excluir">
                      <i data-lucide="trash-2"></i>
                    </button>
                  `}
                </div>
              </td>
            </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

// Render Schedule
function renderScheduleTab() {
  if (state.bookings.length === 0) {
    return `
      <div class="empty-schedule animate-fade-in">
        <i data-lucide="calendar-x" style="width: 64px; height: 64px;"></i>
        <p style="font-size: 18px; font-weight: 600; margin-top: 16px;">Nenhum agendamento cadastrado ainda</p>
      </div>
    `;
  }

  const sortedBookings = [...state.bookings].sort((a, b) => {
    const dateA = new Date(a.checkIn);
    const dateB = new Date(b.checkIn);
    return dateA - dateB;
  });

  return `
    <h2 class="schedule-title animate-fade-in">
      <i data-lucide="calendar" style="width: 32px; height: 32px;"></i>
      Calendário de Agendamentos
    </h2>
    <div class="schedule-container">
      ${sortedBookings.map((booking, index) => {
        const checkIn = new Date(booking.checkIn + 'T00:00:00');
        const checkOut = new Date(booking.checkOut + 'T00:00:00');
        const days = Math.ceil((checkOut - checkIn) / (1000 * 60 * 60 * 24));
        const eventStatus = getEventStatus(booking.checkIn, booking.checkOut);
        
        return `
          <div class="schedule-card animate-fade-in" style="animation-delay: ${index * 0.1}s;">
            <div class="schedule-header">
              <div class="schedule-content">
                <h3 class="schedule-name">${booking.name}</h3>
                <div class="schedule-grid">
                  <div class="schedule-grid-item">
                    <i data-lucide="log-in" style="width: 16px; height: 16px; color: #10b981;"></i>
                    <span class="text-gray-400" style="font-size: 12px;">Check-in:</span>
                    <span class="text-gray-300" style="font-weight: 600;">${fmtDate(booking.checkIn)}</span>
                  </div>
                  <div class="schedule-grid-item">
                    <i data-lucide="log-out" style="width: 16px; height: 16px; color: #f59e0b;"></i>
                    <span class="text-gray-400" style="font-size: 12px;">Check-out:</span>
                    <span class="text-gray-300" style="font-weight: 600;">${fmtDate(booking.checkOut)}</span>
                  </div>
                  <div class="schedule-grid-item">
                    <i data-lucide="clock" style="width: 16px; height: 16px; color: #6b7280;"></i>
                    <span class="text-gray-400" style="font-size: 12px;">Período:</span>
                    <span class="text-gray-300" style="font-weight: 600;">${days} ${days === 1 ? 'dia' : 'dias'}</span>
                  </div>
                  <div class="schedule-grid-item">
                    <i data-lucide="users" style="width: 16px; height: 16px; color: #6b7280;"></i>
                    <span class="text-gray-400" style="font-size: 12px;">Pessoas:</span>
                    <span class="text-gray-300" style="font-weight: 600;">${booking.guests || 0}</span>
                  </div>
                  <div class="schedule-grid-item">
                    <i data-lucide="${eventStatus.icon}" style="width: 16px; height: 16px;"></i>
                    <span class="text-gray-400" style="font-size: 12px;">Status:</span>
                    <span class="badge ${eventStatus.color}" style="padding: 4px 10px; font-size: 12px;">
                      ${eventStatus.status}
                    </span>
                  </div>
                  <div class="schedule-grid-item">
                    <i data-lucide="credit-card" style="width: 16px; height: 16px;"></i>
                    <span class="text-gray-400" style="font-size: 12px;">Pgto:</span>
                    <span class="badge ${booking.pending > 0 ? 'orange' : 'green'}" style="padding: 4px 10px; font-size: 12px;">
                      ${booking.pending > 0 ? 'Pendente' : 'Pago'}
                    </span>
                  </div>
                </div>
                ${booking.note ? `
                  <div class="schedule-note">
                    <strong style="color: #059669;">💭 Observação:</strong> ${booking.note}
                  </div>
                ` : ''}
                ${booking.seller ? `
                  <div class="schedule-note" style="border-left-color: #3b82f6;">
                    <strong style="color: #2563eb;">👤 Vendedor:</strong> ${booking.seller}
                  </div>
                ` : ''}
              </div>
              <div class="schedule-price">
                <div class="schedule-price-label">Total</div>
                <div class="schedule-price-value">${fmt(booking.total)}</div>
                ${booking.pending > 0 ? `
                  <div class="schedule-pending">
                    ⚠️ Falta: ${fmt(booking.pending)}
                  </div>
                ` : `
                  <div style="font-size: 13px; color: #10b981; margin-top: 8px; font-weight: 600;">
                    ✓ Pago
                  </div>
                `}
              </div>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

// Render
function render() {
  document.getElementById('root').innerHTML = `
    <div class="container">
      <div class="card">
        <div class="header">
          <div class="header-icon">
            <i data-lucide="sparkles" style="width: 32px; height: 32px; color: white;"></i>
          </div>
          <div class="header-content">
            <h1>Sítio Escola de Cura</h1>
            <p>Sistema de Hospedagens</p>
          </div>
        </div>
        <div class="tabs">
          <button class="tab ${state.activeTab === 'bookings' ? 'active' : ''}" onclick="changeTab('bookings')">
            <i data-lucide="home"></i>
            Hospedagens
          </button>
          <button class="tab ${state.activeTab === 'schedule' ? 'active' : ''}" onclick="changeTab('schedule')">
            <i data-lucide="calendar"></i>
            Agendamentos
          </button>
        </div>
        ${state.activeTab === 'bookings' ? renderBookingsTab() : renderScheduleTab()}
      </div>
    </div>
  `;
  lucide.createIcons();
}

document.addEventListener('DOMContentLoaded', loadBookings);
</script>
</body>
</html>
